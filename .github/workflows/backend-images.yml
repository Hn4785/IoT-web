name: Backend Images & Architecture Gate

on:
  push:
    branches: [BE]
  pull_request:
    branches: [BE]

permissions:
  contents: read

jobs:
  image-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: warn
      WEATHER_API_BASE_URL: https://example.invalid/api/v1
      WEATHER_API_KEY: ci-weather-placeholder
      WEATHER_API_TIMEOUT_MS: 1000
      DATABASE_URL: postgresql://iot_app:ci-database-password@iot-postgres-ci:5432/iot_dev?schema=public
      TEST_DATABASE_URL: postgresql://iot_app:ci-database-password@iot-postgres-ci:5432/iot_test?schema=public
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      CREDENTIAL_PEPPER: ci-credential-pepper-distinct-32-chars
      SOIL_LATEST_CACHE_TTL_MS: 30000
      SOIL_HISTORY_CACHE_TTL_MS: 300000
      SOIL_STALE_AFTER_MS: 900000
      SOIL_STALE_IF_ERROR_MS: 300000
      SOIL_CACHE_MAX_ENTRIES: 500
      ALERT_EVALUATION_INTERVAL_MS: 60000
      ALERT_EVALUATION_BATCH_SIZE: 50
      ALERT_EVALUATOR_LEASE_MS: 55000
      ALERT_IDEMPOTENCY_RETENTION_HOURS: 168
      ALERT_DEMO_METADATA_ENABLED: false
      ALERT_DEMO_STATION_CODES: ''
      DATA_SOURCE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      DATA_SOURCE_ALLOWED_ORIGINS: https://example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Docker runtime & tools
        run: |
          docker build --target runtime -t iot-backend-runtime .
          docker build --target tools -t iot-backend-tools .
      - name: Test tools inside container as nonroot UID 1000
        run: |
          test "$(docker run --rm iot-backend-tools id -u)" = 1000
          docker run --rm iot-backend-tools pnpm exec prisma --version
          docker run --rm iot-backend-tools pnpm exec tsx --version
      - name: Run Postgres and migrations in CI network
        run: |
          docker network create iot-ci-net
          docker run -d --name iot-postgres-ci --network iot-ci-net -e POSTGRES_PASSWORD=ci-database-password -e POSTGRES_USER=iot_app -e POSTGRES_DB=iot_dev postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          for attempt in {1..30}; do
            docker exec iot-postgres-ci pg_isready -U iot_app -d iot_dev && break
            if [ $attempt -eq 30 ]; then exit 1; fi
            sleep 1
          done
          docker exec iot-postgres-ci createdb -U iot_app iot_test
          docker run --rm --network iot-ci-net -e DATABASE_URL iot-backend-tools pnpm db:migrate:deploy
          docker run --rm --network iot-ci-net -e DATABASE_URL="$TEST_DATABASE_URL" iot-backend-tools pnpm db:migrate:deploy
      - name: Boot runtime smoke container and verify readiness
        run: |
          docker run -d --name iot-api-smoke --network iot-ci-net -p 3000:3000 \
            -e NODE_ENV=production -e PORT=3000 -e LOG_LEVEL=warn \
            -e WEATHER_API_BASE_URL=https://example.invalid/api/v1 -e WEATHER_API_KEY=ci-weather-placeholder -e WEATHER_API_TIMEOUT_MS=1000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            -e FRONTEND_ORIGIN=http://localhost:5173 \
            -e JWT_SECRET=ci-jwt-secret-with-at-least-32-characters \
            -e CREDENTIAL_PEPPER=ci-credential-pepper-distinct-32-chars \
            -e SOIL_LATEST_CACHE_TTL_MS=30000 -e SOIL_HISTORY_CACHE_TTL_MS=300000 \
            -e SOIL_STALE_AFTER_MS=900000 -e SOIL_STALE_IF_ERROR_MS=300000 -e SOIL_CACHE_MAX_ENTRIES=500 \
            -e ALERT_EVALUATION_INTERVAL_MS=60000 -e ALERT_EVALUATION_BATCH_SIZE=50 \
            -e ALERT_EVALUATOR_LEASE_MS=55000 -e ALERT_IDEMPOTENCY_RETENTION_HOURS=168 \
            -e ALERT_DEMO_METADATA_ENABLED=false -e ALERT_DEMO_STATION_CODES= \
            -e DATA_SOURCE_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE= \
            -e DATA_SOURCE_ALLOWED_ORIGINS=https://example.invalid \
            iot-backend-runtime
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/api/v1/health && break
            if [ $attempt -eq 30 ]; then exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/v1/readiness
          test "$(docker exec iot-api-smoke id -u)" = 1000
      - name: Export verified runtime artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/BE'
        run: |
          mkdir -p runtime-artifact
          docker tag iot-backend-runtime agrisense-api:${{ github.sha }}
          docker save agrisense-api:${{ github.sha }} | gzip > runtime-artifact/runtime.tar.gz
          cd runtime-artifact
          sha256sum runtime.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && github.ref == 'refs/heads/BE'
        with:
          name: runtime-${{ matrix.os }}-${{ github.sha }}
          path: |
            runtime-artifact/runtime.tar.gz
            runtime-artifact/SHA256SUMS
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
      - name: Cleanup CI container and network
        if: always()
        run: |
          docker stop iot-api-smoke || true
          docker rm iot-api-smoke || true
          docker stop iot-postgres-ci || true
          docker rm iot-postgres-ci || true
          docker network rm iot-ci-net || true
