services:
  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20

  migration:
    image: ${API_TOOLS_IMAGE:?API_TOOLS_IMAGE is required}
    profiles:
      - maintenance
    restart: 'no'
    command: pnpm db:migrate:deploy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL:?WEATHER_API_BASE_URL is required}
      WEATHER_API_KEY: ${WEATHER_API_KEY:?WEATHER_API_KEY is required}
      WEATHER_API_TIMEOUT_MS: ${WEATHER_API_TIMEOUT_MS:-5000}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:?TEST_DATABASE_URL is required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CREDENTIAL_PEPPER: ${CREDENTIAL_PEPPER:?CREDENTIAL_PEPPER is required}
      DATA_SOURCE_ENCRYPTION_KEY: ${DATA_SOURCE_ENCRYPTION_KEY:?DATA_SOURCE_ENCRYPTION_KEY is required}
      DATA_SOURCE_ALLOWED_ORIGINS: ${DATA_SOURCE_ALLOWED_ORIGINS:?DATA_SOURCE_ALLOWED_ORIGINS is required}
      SOIL_LATEST_CACHE_TTL_MS: ${SOIL_LATEST_CACHE_TTL_MS:-30000}
      SOIL_HISTORY_CACHE_TTL_MS: ${SOIL_HISTORY_CACHE_TTL_MS:-300000}
      SOIL_STALE_AFTER_MS: ${SOIL_STALE_AFTER_MS:-900000}
      SOIL_STALE_IF_ERROR_MS: ${SOIL_STALE_IF_ERROR_MS:-300000}
      SOIL_CACHE_MAX_ENTRIES: ${SOIL_CACHE_MAX_ENTRIES:-500}
      SOIL_COLLECTION_ENABLED: ${SOIL_COLLECTION_ENABLED:-true}
      SOIL_COLLECTION_INTERVAL_MS: ${SOIL_COLLECTION_INTERVAL_MS:-120000}
      SOIL_COLLECTION_CONCURRENCY: ${SOIL_COLLECTION_CONCURRENCY:-2}
      SOIL_COLLECTION_BATCH_SIZE: ${SOIL_COLLECTION_BATCH_SIZE:-20}
      SOIL_COLLECTION_PAGE_LIMIT: ${SOIL_COLLECTION_PAGE_LIMIT:-10}
      SOIL_COLLECTION_LEASE_MS: ${SOIL_COLLECTION_LEASE_MS:-115000}
      SOIL_RAW_STATION_LIMIT: ${SOIL_RAW_STATION_LIMIT:-2000000}
      SOIL_RAW_GLOBAL_LIMIT: ${SOIL_RAW_GLOBAL_LIMIT:-10000000}
      ALERT_EVALUATION_INTERVAL_MS: ${ALERT_EVALUATION_INTERVAL_MS:-60000}
      ALERT_EVALUATION_BATCH_SIZE: ${ALERT_EVALUATION_BATCH_SIZE:-50}
      ALERT_EVALUATOR_LEASE_MS: ${ALERT_EVALUATOR_LEASE_MS:-55000}
      ALERT_IDEMPOTENCY_RETENTION_HOURS: ${ALERT_IDEMPOTENCY_RETENTION_HOURS:-168}
      ALERT_DEMO_METADATA_ENABLED: 'false'
      ALERT_DEMO_STATION_CODES: ${ALERT_DEMO_STATION_CODES:-}
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - private
      - egress
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/v1/readiness'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - private
      - egress
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8080/healthz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  private:
    internal: true
  egress:

volumes:
  postgres_data:
